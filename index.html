<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jujutsu Battles - Mobile UI</title>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #060709;
      color: #ffffff;
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    /* Application Mobile Container */
    .app-container {
      width: 100%;
      max-width: 400px;
      height: 85vh;
      max-height: 780px;
      background: #0d0f14;
      border: 2px solid #1e2430;
      border-radius: 24px;
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
      box-shadow: 0 15px 35px rgba(0,0,0,0.8), 0 0 20px rgba(139, 92, 246, 0.15);
    }

    /* Top Bar */
    .top-bar {
      background: #11141c;
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #1f2430;
      font-size: 0.85em;
    }

    .user-profile {
      display: flex;
      align-items: center;
      gap: 6px;
      background: #1a1e29;
      padding: 4px 10px;
      border-radius: 20px;
      border: 1px solid #8b5cf6;
      font-weight: bold;
    }

    /* Zone de Contenu */
    .content-area {
      flex: 1;
      overflow-y: auto;
      padding: 15px;
      position: relative;
    }

    .page { display: none; }
    .page.active { display: block; }

    /* PAGE ACCUEIL */
    .hero-card-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-top: 5px;
    }

    .badge-rank {
      background: #3b82f6;
      color: white;
      padding: 4px 14px;
      border-radius: 12px;
      font-size: 0.75em;
      font-weight: bold;
      margin-bottom: 8px;
      text-transform: uppercase;
    }

    .main-card {
      background: linear-gradient(145deg, #161922, #0f1118);
      border: 3px solid #8b5cf6;
      border-radius: 18px;
      width: 100%;
      max-width: 270px;
      padding: 15px;
      box-shadow: 0 10px 25px rgba(139, 92, 246, 0.3);
      text-align: center;
    }

    .main-card-header {
      background: #000;
      border: 1px solid #334155;
      padding: 6px;
      border-radius: 8px;
      font-weight: bold;
      font-size: 0.9em;
      margin-bottom: 10px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .main-card-avatar {
      width: 100%;
      height: 220px;
      border-radius: 12px;
      overflow: hidden;
      border: 2px solid #8b5cf6;
      background: #000;
      box-shadow: 0 0 10px rgba(139, 92, 246, 0.4);
    }

    .main-card-avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center top;
    }

    .stats-row {
      display: flex;
      justify-content: space-around;
      margin: 12px 0 5px 0;
      font-weight: bold;
      font-size: 0.9em;
    }

    .btn-fight {
      background: linear-gradient(135deg, #ef4444, #dc2626);
      color: white;
      border: 2px solid #f87171;
      padding: 14px 0;
      width: 100%;
      border-radius: 14px;
      font-size: 1.1em;
      font-weight: 900;
      letter-spacing: 2px;
      cursor: pointer;
      box-shadow: 0 6px 20px rgba(239, 68, 68, 0.4);
      margin-top: 15px;
    }
    .btn-fight:active { transform: scale(0.97); }

    /* PAGE ARÈNE COMBAT */
    .battle-box {
      background: #141721;
      border: 1px solid #272f3f;
      border-radius: 12px;
      padding: 10px;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .battle-avatar {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      overflow: hidden;
      border: 2px solid #8b5cf6;
      flex-shrink: 0;
      background: #000;
    }
    .battle-avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center top;
    }

    .gauge-bg { background: #262d3d; height: 10px; border-radius: 5px; overflow: hidden; margin: 4px 0; }
    .bar-hp { background: #ef4444; height: 100%; width: 100%; transition: width 0.3s; }
    .bar-energy { background: #3b82f6; height: 100%; width: 100%; transition: width 0.3s; }

    .action-btn {
      background: #8b5cf6;
      color: white;
      border: none;
      padding: 12px;
      width: 100%;
      border-radius: 8px;
      font-weight: bold;
      margin-top: 8px;
      cursor: pointer;
    }

    #logs {
      background: #090a0f;
      border: 1px solid #1f2430;
      padding: 10px;
      height: 100px;
      overflow-y: auto;
      border-radius: 8px;
      font-family: monospace;
      font-size: 0.78em;
      text-align: left;
      margin-top: 10px;
    }

    /* PAGE COLLECTION & NOUVELLES BORDURES */
    .collection-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      margin-top: 10px;
    }

    .col-card {
      background: #141721;
      border: 1.5px solid #272f3f;
      border-radius: 14px;
      padding: 8px;
      position: relative;
      text-align: center;
      cursor: pointer;
      transition: transform 0.2s, border-color 0.2s;
    }
    .col-card:hover {
      transform: translateY(-2px);
    }

    .col-card.active-char {
      border: 2px solid #22c55e;
      box-shadow: 0 0 12px rgba(34, 197, 94, 0.5);
    }

    .badge-equipped {
      position: absolute;
      top: 6px;
      right: 6px;
      background: #22c55e;
      color: #000;
      font-size: 0.6em;
      font-weight: bold;
      padding: 2px 6px;
      border-radius: 4px;
      z-index: 2;
    }

    .col-avatar {
      width: 100%;
      height: 150px;
      border-radius: 10px;
      overflow: hidden;
      margin-bottom: 8px;
      border: 2px solid #8b5cf6;
      background: #000;
      box-shadow: inset 0 0 10px rgba(0, 0, 0, 0.8), 0 0 8px rgba(139, 92, 246, 0.25);
    }

    .col-avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center top;
    }

    .col-name { 
      font-size: 0.85em; 
      font-weight: bold; 
      margin-top: 2px;
    }
    
    .col-rank { 
      font-size: 0.7em; 
      color: #8b5cf6; 
      font-weight: bold; 
    }

    /* NAVIGATION EN BAS */
    .bottom-nav {
      height: 60px;
      background: #090a0f;
      border-top: 1px solid #1e2430;
      display: flex;
      justify-content: space-around;
      align-items: center;
    }

    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      color: #64748b;
      font-size: 0.68em;
      cursor: pointer;
      background: none;
      border: none;
      gap: 3px;
    }

    .nav-item .icon { font-size: 1.3em; }
    .nav-item.active { color: #8b5cf6; font-weight: bold; }
  </style>
</head>
<body>

  <div class="app-container">
    
    <!-- Top Bar -->
    <div class="top-bar">
      <div class="user-profile">👤 Exorciste Pro</div>
      <div style="color: #eab308; font-weight: bold;">💎 1,250</div>
    </div>

    <!-- Zone de Contenu -->
    <div class="content-area">

      <!-- 1. ACCUEIL -->
      <div id="page-home" class="page active">
        <div class="hero-card-container">
          <div class="badge-rank" id="home-rank">Rang B+</div>

          <div class="main-card">
            <div class="main-card-header" id="home-name">Yuji Itadori</div>
            <div class="main-card-avatar">
              <img id="home-img" src="" alt="Avatar">
            </div>
            
            <div class="stats-row">
              <div>❤️ <span id="home-hp">120</span> PV</div>
              <div>⚔️ <span id="home-atk">14</span> ATK</div>
            </div>
          </div>
        </div>

        <button class="btn-fight" id="btn-start-fight">⚡ COMBATTRE</button>
      </div>

      <!-- 2. ARÈNE COMBAT -->
      <div id="page-battle" class="page">
        <h4 style="margin: 0 0 10px 0; color:#8b5cf6; text-align:center;">Combat JJK</h4>

        <!-- Ennemi -->
        <div class="battle-box" style="border-color: #ef4444;">
          <div class="battle-avatar">
            <img src="mahito.png" alt="Mahito">
          </div>
          <div style="flex:1;">
            <div style="display:flex; justify-content:space-between; font-size:0.85em;">
              <strong>Mahito (Fléau)</strong>
              <span style="color:#ef4444; font-weight:bold;"><span id="enemy-hp">150</span>/150</span>
            </div>
            <div class="gauge-bg"><div id="enemy-hp-bar" class="bar-hp"></div></div>
          </div>
        </div>

        <!-- Joueur -->
        <div class="battle-box">
          <div class="battle-avatar">
            <img id="battle-player-img" src="" alt="Joueur">
          </div>
          <div style="flex:1;">
            <div style="display:flex; justify-content:space-between; font-size:0.85em;">
              <strong id="battle-player-name">Yuji Itadori</strong>
              <span style="color:#22c55e; font-weight:bold;"><span id="battle-player-hp">120</span> PV</span>
            </div>
            <div class="gauge-bg"><div id="player-hp-bar" class="bar-hp"></div></div>
            
            <div style="display:flex; justify-content:space-between; font-size:0.7em; color:#94a3b8; margin-top:2px;">
              <span>Énergie</span>
              <span style="color:#3b82f6; font-weight:bold;"><span id="battle-player-energy">50</span></span>
            </div>
            <div class="gauge-bg"><div id="player-energy-bar" class="bar-energy"></div></div>
          </div>
        </div>

        <button class="action-btn" id="btn-atk-physique">👊 Attaque Physique</button>
        <button class="action-btn" id="btn-atk-sort" style="background:#7c3aed;">⚡ Sort Spécial</button>

        <div id="logs"></div>
      </div>

      <!-- 3. COLLECTION -->
      <div id="page-collection" class="page">
        <h4 style="margin: 0 0 4px 0; text-align: left;">Ma Collection</h4>
        <p style="font-size: 0.75em; color: #94a3b8; text-align: left; margin: 0 0 10px 0;">Cliquez sur un personnage pour l'incarner.</p>
        
        <div class="collection-grid" id="collection-container"></div>
      </div>

    </div>

    <!-- Navigation du Bas -->
    <div class="bottom-nav">
      <button class="nav-item active" id="nav-home">
        <span class="icon">⚔️</span>
        <span>Accueil</span>
      </button>
      <button class="nav-item" id="nav-collection">
        <span class="icon">📜</span>
        <span>Collection</span>
      </button>
      <button class="nav-item" id="nav-invocation">
        <span class="icon">🎴</span>
        <span>Invocation</span>
      </button>
      <button class="nav-item" id="nav-ranked">
        <span class="icon">🏆</span>
        <span>Classé</span>
      </button>
    </div>

  </div>

  <script src="java.js"></script>
</body>
</html>
